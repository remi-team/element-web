apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: sit-im
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: element-web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: element-web
    spec:
      containers:
        - args:
            - >
              # 如果 /app/config.json 是目录则删除

              if [ -d /app/config.json ]; then rm -rf /app/config.json; fi

              # 复制配置文件

              cp /tmp/config/config.im-web-sit.testremitech.ai.json
              /app/config.json

              cp /tmp/config/config.im-web-sit.testremitech.ai.json
              /app/config.im-web-sit.testremitech.ai.json

              # 启动原始 entrypoint

              exec /docker-entrypoint.sh nginx -g "daemon off;"
          command:
            - /bin/sh
            - '-c'
          env:
            - name: ELEMENT_WEB_PORT
              value: '8080'
          image: {{FULL_IMAGE_NAME}}
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: element-web
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /tmp/config/config.im-web-sit.testremitech.ai.json
              name: config-volume
              subPath: config.im-web-sit.testremitech.ai.json
            - mountPath: /app/config.im-web-sit.testremitech.ai.json
              name: config-volume
              subPath: config.im-web-sit.testremitech.ai.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: registry-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: element-web-config
          name: config-volume
